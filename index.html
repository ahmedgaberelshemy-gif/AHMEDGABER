<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>منظومة الامتياز والتفوق الأكاديمي</title>
  
  <!-- CDNs & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti & Firebase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <link rel="stylesheet" href="css/styles.css?v=59.0" />
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-600 selection:text-white relative bg-slate-50 text-slate-900 font-cairo overflow-x-hidden">

  <!-- Dynamic Ambient Living Motion Graphics Glows -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="ambient-aurora-blob1 absolute -top-40 -right-40 w-[30rem] h-[30rem] rounded-full bg-indigo-500/15 filter blur-3xl"></div>
    <div class="ambient-aurora-blob2 absolute top-1/3 -left-40 w-[32rem] h-[32rem] rounded-full bg-emerald-500/15 filter blur-3xl"></div>
    <div class="ambient-aurora-blob3 absolute -bottom-40 right-1/4 w-[34rem] h-[34rem] rounded-full bg-amber-500/15 filter blur-3xl"></div>
    <div class="ambient-aurora-blob1 absolute top-2/3 right-1/3 w-[26rem] h-[26rem] rounded-full bg-purple-500/10 filter blur-3xl"></div>
  </div>

  <div>
    <!-- 1. HEADER (parts/header.html) -->
    <div id="part-header"></div>

    <!-- 2. NAVIGATION (parts/navigation.html) -->
    <div id="part-navigation"></div>

    <!-- 3. MAIN WORKSPACE (parts/section-*.html) -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6" id="part-main-workspace"></main>
  </div>

  <!-- 4. MODALS (parts/modals.html) -->
  <div id="part-modals"></div>

  <!-- 5. FOOTER (parts/footer.html) -->
  <div id="part-footer"></div>

  <!-- Application Modular Scripts & Parts Loader -->
  <script src="js/config.js?v=59.0"></script>
  <script src="js/data.js?v=59.0"></script>
  <script src="js/services.js?v=59.0"></script>
  <script src="parts/parts-data.js?v=59.0"></script>
  <script src="js/views.js?v=59.0"></script>
  <script src="js/app.js?v=59.0"></script>
</body>
</html>
