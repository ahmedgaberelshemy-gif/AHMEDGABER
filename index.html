<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>منظومة الامتياز والتفوق الأكاديمي</title>
  
  <!-- CDNs & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti & Firebase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <link rel="stylesheet" href="css/styles.css?v=200.0" />

  <style>
    /* Absolute Fail-Safe: Closed modals NEVER intercept clicks on any device */
    html body #cloudSyncModal.opacity-0,
    html body #dailyResultModal.opacity-0,
    html body #noteModal.opacity-0,
    html body .opacity-0.pointer-events-none {
      pointer-events: none !important;
      visibility: hidden !important;
    }

    html body #cloudSyncModal:not(.opacity-0),
    html body #dailyResultModal:not(.opacity-0),
    html body #noteModal:not(.opacity-0) {
      pointer-events: auto !important;
      visibility: visible !important;
      z-index: 100 !important;
    }

    /* All interactive controls are always guaranteed to receive user touches & clicks */
    html body button, 
    html body input, 
    html body label, 
    html body a, 
    html body select, 
    html body textarea, 
    html body .checkbox-custom, 
    html body .tab-btn {
      pointer-events: auto !important;
      cursor: pointer;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-600 selection:text-white relative bg-[#060b17] text-slate-100 font-cairo overflow-x-hidden">

  <!-- Ambient background: Midnight dark with subtle radial glows -->
  <div class="fixed inset-0 pointer-events-none z-0 opacity-40">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -left-40 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 right-1/3 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10">
    <!-- 1. HEADER (parts/header.html) -->
    <div id="part-header"></div>

    <!-- 2. NAVIGATION (parts/navigation.html) -->
    <div id="part-navigation"></div>

    <!-- 3. MAIN WORKSPACE (parts/section-*.html) -->
    <main class="max-w-[1560px] mx-auto px-2.5 sm:px-6 lg:px-8 py-3.5 sm:py-6" id="part-main-workspace"></main>
  </div>

  <!-- 4. MODALS (parts/modals.html) -->
  <div id="part-modals"></div>

  <!-- 5. FOOTER (parts/footer.html) -->
  <div id="part-footer"></div>

  <!-- Application Modular Scripts & Parts Loader -->
  <script src="js/config.js?v=200.0"></script>
  <script src="js/data.js?v=200.0"></script>
  <script src="js/services.js?v=200.0"></script>
  <script src="parts/parts-data.js?v=200.0"></script>
  <script src="js/views.js?v=200.0"></script>
  <script src="js/app.js?v=200.0"></script>
</body>
</html>
