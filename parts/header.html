<!-- TOP HEADER (INSPIRED BY REFERENCE ARCHITECTURE) -->
<header class="bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 text-white border-b-4 border-amber-500 shadow-xl relative overflow-hidden">
  <!-- Metallic Gold Shimmer Ribbon -->
  <div class="h-1.5 w-full shimmer-gold"></div>

  <div class="max-w-[1560px] mx-auto px-3 sm:px-6 lg:px-8 py-3.5 sm:py-4.5 flex flex-col md:flex-row items-center justify-between gap-3 sm:gap-4">
    
    <!-- Right: System Title & Gold Crown Logo Badge -->
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 text-slate-950 flex items-center justify-center text-lg sm:text-2xl font-black shadow-lg shadow-amber-500/25 shrink-0 border border-amber-300">
        <i class="fa-solid fa-crown text-slate-950 drop-shadow"></i>
      </div>
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <h1 class="text-sm xs:text-base sm:text-xl lg:text-2xl font-black font-display text-white tracking-tight">
            المعهد العالي للعلوم الإدارية بجناكليس
          </h1>
          <span class="px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 text-[10px] sm:text-xs font-black font-display hidden lg:inline-flex items-center gap-1 shadow-xs">
            <i class="fa-solid fa-graduation-cap text-amber-400"></i> الميثاق الأكاديمي
          </span>
        </div>
        <span class="text-[11px] sm:text-xs text-slate-300 font-bold block mt-0.5">منظومة الامتياز والتفوق الأكاديمي | بوابة المتابعة الذكية</span>
      </div>
    </div>

    <!-- Center: Academic Year Badge -->
    <div class="hidden sm:flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-500/15 border border-amber-400/40 text-amber-300 text-xs sm:text-sm font-black shadow-md shadow-amber-500/10">
      <i class="fa-solid fa-calendar-days text-amber-400"></i>
      <span>العام الجامعي 2026 / 2027</span>
    </div>

    <!-- Left: Cloud Sync Badge & Sound Controls -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <!-- Cloud Sync Badge Button -->
      <div 
        id="cloudSyncHeaderBadge" 
        onclick="openCloudSyncModal()" 
        title="المزامنة السحابية الفورية بين الأجهزة"
        class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-100 border border-slate-700 text-[10px] sm:text-xs font-bold font-display shadow-md backdrop-blur-md flex items-center gap-1.5 sm:gap-2 cursor-pointer transition active:scale-95"
      >
        <i class="fa-solid fa-cloud-arrow-up text-amber-400 text-xs sm:text-sm"></i>
        <span>تخزين محلي ⚪</span>
      </div>

      <!-- Sound Toggle Button -->
      <button 
        onclick="toggleSoundMute()" 
        id="soundToggleBtn" 
        title="تبديل المؤثرات الصوتية الفاخرة"
        class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-xs sm:text-sm text-amber-400 transition active:scale-95 shadow-md"
      >
        <i class="fa-solid fa-volume-high text-amber-400" id="soundToggleIcon"></i>
      </button>
    </div>

  </div>
</header>
