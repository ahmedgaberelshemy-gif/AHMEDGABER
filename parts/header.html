<!-- TOP HEADER -->
    <header class="bg-gradient-to-r from-slate-950 via-indigo-950 to-slate-900 text-white border-b border-indigo-900/50 shadow-md relative overflow-hidden">
      <!-- Metallic Gold Shimmer Light Ribbon -->
      <div class="h-1 w-full shimmer-gold"></div>

      <div class="max-w-[1560px] mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-4 flex items-center justify-between gap-2 sm:gap-4">
        
        <!-- Right: System Title -->
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-sm sm:text-lg text-amber-400 shadow-inner shrink-0">
            <i class="fa-solid fa-crown text-amber-400"></i>
          </div>
          <h1 class="text-xs xs:text-sm sm:text-xl lg:text-2xl font-black font-display text-white tracking-tight truncate sm:whitespace-normal">
            منظومة الامتياز والتفوق الأكاديمي
          </h1>
        </div>

        <!-- Left: Cloud Sync, Sound Toggle & Controls -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
          <!-- Cloud Sync Badge Button -->
          <div 
            id="cloudSyncHeaderBadge" 
            onclick="app.openCloudSyncModal()" 
            title="المزامنة السحابية الفورية بين الأجهزة"
            class="px-2.5 sm:px-3.5 py-1.5 rounded-full bg-slate-500/20 text-slate-300 border border-slate-500/30 text-[10px] sm:text-xs font-bold font-display shadow-2xs backdrop-blur-xs flex items-center gap-1 sm:gap-1.5 cursor-pointer hover:bg-indigo-500/30 transition active:scale-95"
          >
            <i class="fa-solid fa-cloud-arrow-up text-slate-400"></i>
            <span>تخزين محلي ⚪</span>
          </div>

          <!-- Sound Toggle Button -->
          <button 
            onclick="toggleSoundMute()" 
            id="soundToggleBtn" 
            title="تبديل المؤثرات الصوتية الفاخرة"
            class="w-7 h-7 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-400/30 flex items-center justify-center text-xs transition active:scale-95 shadow-2xs"
          >
            <i class="fa-solid fa-volume-high text-amber-400" id="soundToggleIcon"></i>
          </button>
        </div>

      </div>
    </header>
