<!-- TOP HEADER (CLEAN & PERFECTLY BALANCED LAYOUT) -->
<header class="bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 text-white border-b-4 border-amber-500 shadow-xl relative overflow-hidden">
  <!-- Metallic Gold Shimmer Ribbon -->
  <div class="h-1.5 w-full shimmer-gold"></div>

  <div class="max-w-[1560px] mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 sm:gap-4">
    
    <!-- Right: Brand Logo & Title Block -->
    <div class="flex items-center gap-3.5 min-w-0">
      <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 text-slate-950 flex items-center justify-center text-xl sm:text-2xl font-black shadow-lg shadow-amber-500/25 shrink-0 border border-amber-300">
        <i class="fa-solid fa-crown text-slate-950 drop-shadow-xs"></i>
      </div>
      <div>
        <h1 class="text-base sm:text-lg lg:text-xl font-black font-display text-white tracking-tight leading-snug">
          المعهد العالي للعلوم الإدارية بجناكليس
        </h1>
        <span class="text-xs text-slate-300 font-bold block mt-0.5">منظومة الامتياز والتفوق الأكاديمي | بوابة المتابعة الذكية</span>
      </div>
    </div>

    <!-- Center: Academic Year Gold Pill Badge -->
    <div class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-500/15 border border-amber-400/40 text-amber-300 text-xs sm:text-sm font-black shadow-md shadow-amber-500/10 shrink-0">
      <i class="fa-solid fa-calendar-days text-amber-400"></i>
      <span>العام الجامعي 2026 / 2027</span>
    </div>

    <!-- Left: Cloud Sync Status & Sound Toggle -->
    <div class="flex items-center gap-2.5 sm:gap-3 shrink-0">
      <!-- Cloud Sync Badge Button -->
      <div 
        id="cloudSyncHeaderBadge" 
        onclick="openCloudSyncModal()" 
        title="المزامنة السحابية الفورية بين الأجهزة"
        class="px-3.5 sm:px-4 py-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-100 border border-slate-700 text-xs font-bold font-display shadow-md backdrop-blur-md flex items-center gap-2 cursor-pointer transition active:scale-95"
      >
        <i class="fa-solid fa-cloud-arrow-up text-amber-400 text-sm"></i>
        <span>تخزين محلي ⚪</span>
      </div>

      <!-- Sound Toggle Button -->
      <button 
        onclick="toggleSoundMute()" 
        id="soundToggleBtn" 
        title="تبديل المؤثرات الصوتية الفاخرة"
        class="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-sm text-amber-400 transition active:scale-95 shadow-md"
      >
        <i class="fa-solid fa-volume-high text-amber-400" id="soundToggleIcon"></i>
      </button>
    </div>

  </div>
</header>
