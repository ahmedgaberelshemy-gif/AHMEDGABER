<!-- TOP HEADER -->
<header class="bg-white/95 backdrop-blur-xl text-slate-900 border-b border-slate-200 shadow-sm relative overflow-hidden">
  <!-- Metallic Gold Shimmer Ribbon -->
  <div class="h-1.5 w-full shimmer-gold"></div>

  <div class="max-w-[1560px] mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-4 flex items-center justify-between gap-3 sm:gap-4">
    
    <!-- Right: System Title & Crown Icon -->
    <div class="flex items-center gap-2.5 sm:gap-3.5 min-w-0">
      <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl sm:rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-base sm:text-xl text-amber-600 shadow-sm shrink-0">
        <i class="fa-solid fa-crown text-amber-600 drop-shadow-xs"></i>
      </div>
      <div>
        <h1 class="text-xs xs:text-sm sm:text-xl lg:text-2xl font-black font-display text-slate-900 tracking-tight truncate sm:whitespace-normal">
          منظومة الامتياز والتفوق الأكاديمي
        </h1>
        <span class="hidden sm:block text-[11px] text-slate-500 font-bold">المعهد العالي للعلوم الإدارية بجناكليس | بوابة المتابعة الذكية</span>
      </div>
    </div>

    <!-- Left: Cloud Sync Badge & Sound Controls -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <!-- Cloud Sync Badge Button -->
      <div 
        id="cloudSyncHeaderBadge" 
        onclick="openCloudSyncModal()" 
        title="المزامنة السحابية الفورية بين الأجهزة"
        class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 text-[10px] sm:text-xs font-bold font-display shadow-xs flex items-center gap-1.5 sm:gap-2 cursor-pointer transition active:scale-95"
      >
        <i class="fa-solid fa-cloud-arrow-up text-amber-600 text-xs sm:text-sm"></i>
        <span>تخزين محلي ⚪</span>
      </div>

      <!-- Sound Toggle Button -->
      <button 
        onclick="toggleSoundMute()" 
        id="soundToggleBtn" 
        title="تبديل المؤثرات الصوتية الفاخرة"
        class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 flex items-center justify-center text-xs sm:text-sm text-amber-600 transition active:scale-95 shadow-xs"
      >
        <i class="fa-solid fa-volume-high text-amber-600" id="soundToggleIcon"></i>
      </button>
    </div>

  </div>
</header>
