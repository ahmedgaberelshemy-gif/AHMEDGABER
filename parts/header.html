<!-- TOP HEADER -->
<header class="bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 text-white border-b border-indigo-900/60 shadow-xl relative overflow-hidden">
  <!-- Metallic Gold Shimmer Ribbon -->
  <div class="h-1 w-full shimmer-gold"></div>

  <div class="max-w-[1560px] mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-4 flex items-center justify-between gap-3 sm:gap-4">
    
    <!-- Right: System Title & Crown Icon -->
    <div class="flex items-center gap-2.5 sm:gap-3.5 min-w-0">
      <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl sm:rounded-2xl bg-gradient-to-br from-amber-500/20 to-amber-600/30 border border-amber-500/40 flex items-center justify-center text-base sm:text-xl text-amber-400 shadow-md shadow-amber-500/10 shrink-0">
        <i class="fa-solid fa-crown text-amber-400 drop-shadow"></i>
      </div>
      <div>
        <h1 class="text-xs xs:text-sm sm:text-xl lg:text-2xl font-black font-display text-white tracking-tight truncate sm:whitespace-normal">
          منظومة الامتياز والتفوق الأكاديمي
        </h1>
        <span class="hidden sm:block text-[11px] text-slate-400 font-medium">المعهد العالي للعلوم الإدارية بجناكليس | بوابة المتابعة الذكية</span>
      </div>
    </div>

    <!-- Left: Cloud Sync Badge & Sound Controls -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <!-- Cloud Sync Badge Button -->
      <div 
        id="cloudSyncHeaderBadge" 
        onclick="app.openCloudSyncModal()" 
        title="المزامنة السحابية الفورية بين الأجهزة"
        class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl bg-slate-800/80 hover:bg-indigo-950/90 text-slate-200 border border-indigo-500/30 text-[10px] sm:text-xs font-bold font-display shadow-sm backdrop-blur-md flex items-center gap-1.5 sm:gap-2 cursor-pointer transition active:scale-95"
      >
        <i class="fa-solid fa-cloud-arrow-up text-amber-400 text-xs sm:text-sm"></i>
        <span>تخزين محلي ⚪</span>
      </div>

      <!-- Sound Toggle Button -->
      <button 
        onclick="toggleSoundMute()" 
        id="soundToggleBtn" 
        title="تبديل المؤثرات الصوتية الفاخرة"
        class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-slate-800/80 hover:bg-indigo-950/90 border border-indigo-500/30 flex items-center justify-center text-xs sm:text-sm text-amber-400 transition active:scale-95 shadow-sm"
      >
        <i class="fa-solid fa-volume-high text-amber-400" id="soundToggleIcon"></i>
      </button>
    </div>

  </div>
</header>
