<!-- ========================================================================= -->
<!-- SECTION: INTEGRATED ROADMAP (خريطة المهارات والشهادات الدولية 🏆) -->
<!-- ========================================================================= -->
<section id="section-roadmap" class="space-y-6 hidden animate-slide-up">

  <!-- Roadmap Overview Hero Banner (3D Glassmorphism) -->
  <div class="bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 text-white rounded-3xl p-4 sm:p-7 shadow-2xl border border-indigo-500/30 relative overflow-hidden card-lift">
    <div class="absolute -right-20 -top-20 w-64 h-64 bg-blue-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -left-20 -bottom-20 w-64 h-64 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 sm:gap-6">
      <div class="space-y-2.5">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="px-3 sm:px-4 py-1 rounded-full bg-blue-500/20 text-blue-300 border border-blue-400/30 text-[11px] sm:text-xs font-black font-display inline-flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-compass text-blue-400"></i> ميثاق المسار الأكاديمي والمهني 🏆
          </span>
          <span class="px-3 sm:px-4 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/30 text-[11px] sm:text-xs font-black font-display shadow-sm" id="roadmapOverallBadge">
            0% مكتمل
          </span>
        </div>
        <h2 class="font-display font-black text-xl sm:text-2xl lg:text-3xl text-white leading-normal sm:leading-relaxed">
          مسار التفوق والريادة: المهارات العملية ⬅️ الشهادات الدولية 🏆
        </h2>
      </div>

      <!-- Quick Metrics Counters -->
      <div class="grid grid-cols-2 gap-2 sm:gap-3.5 w-full lg:w-auto shrink-0">
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3 sm:p-4 border border-white/15 text-center min-w-0 shadow-inner">
          <span class="text-[10px] sm:text-xs text-slate-300 font-bold block mb-1">المهارات والورش</span>
          <span class="text-base sm:text-xl font-black font-display text-indigo-300 font-mono" id="roadmapSkillsStat" dir="ltr">0 / 14</span>
        </div>
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3 sm:p-4 border border-white/15 text-center min-w-0 shadow-inner">
          <span class="text-[10px] sm:text-xs text-slate-300 font-bold block mb-1">الشهادات الدولية</span>
          <span class="text-base sm:text-xl font-black font-display text-emerald-300 font-mono" id="roadmapCertsStat" dir="ltr">0 / 6</span>
        </div>
      </div>
    </div>

    <!-- Live Overall Progress Bar -->
    <div class="mt-6 pt-4 border-t border-white/10">
      <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-300 mb-2">
        <span>مؤشر التقدم الكلي في خارطة الطريق:</span>
        <span id="roadmapOverallPercentText" class="text-blue-300 font-black font-mono text-sm">0%</span>
      </div>
      <div class="w-full h-3.5 bg-slate-900/90 rounded-full overflow-hidden p-0.5 border border-white/15 shadow-inner">
        <div id="roadmapOverallProgressBar" class="h-full bg-gradient-to-r from-blue-500 via-indigo-500 to-emerald-400 rounded-full transition-all duration-500 shimmer-progress-bar" style="width: 0%;"></div>
      </div>
    </div>
  </div>

  <!-- Dynamic 4-Year Columns Grid -->
  <div id="roadmapYearsGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
    <!-- Rendered dynamically by RoadmapView.render -->
  </div>

</section>
