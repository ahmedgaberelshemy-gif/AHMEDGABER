<!-- MAIN 4-SECTION MASTER NAV TABS (Sticky Navigation: Routine, Languages, Roadmap & AI) -->
<div class="max-w-[1560px] mx-auto px-2 sm:px-6 lg:px-8 mt-3 sm:mt-4 sticky top-1 sm:top-3 z-30 no-print">
  <div class="bg-white/95 backdrop-blur-xl rounded-2xl p-1.5 sm:p-2 shadow-md border border-slate-200">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 sm:gap-2">
      
      <!-- Tab 1: Routine -->
      <button 
        onclick="switchTab('routine')" 
        id="tabBtn-routine"
        class="tab-btn py-2.5 sm:py-3.5 px-2 sm:px-3 rounded-xl text-xs sm:text-sm font-display font-black flex flex-col sm:flex-row items-center justify-center gap-1.5 cursor-pointer"
      >
        <i class="fa-solid fa-bolt text-amber-500 text-sm sm:text-base shrink-0"></i>
        <span class="whitespace-nowrap font-extrabold text-[11px] sm:text-xs">
          <span class="sm:hidden">الروتين</span>
          <span class="hidden sm:inline">الروتين والـ 112 يوماً</span>
        </span>
      </button>

      <!-- Tab 2: Languages Track (33 Courses) -->
      <button 
        onclick="switchTab('languages')" 
        id="tabBtn-languages"
        class="tab-btn py-2.5 sm:py-3.5 px-2 sm:px-3 rounded-xl text-xs sm:text-sm font-display font-black flex flex-col sm:flex-row items-center justify-center gap-1.5 cursor-pointer"
      >
        <i class="fa-solid fa-language text-emerald-600 text-sm sm:text-base shrink-0"></i>
        <span class="whitespace-nowrap font-extrabold text-[11px] sm:text-xs">
          <span class="sm:hidden">الانجليزي 🌐</span>
          <span class="hidden sm:inline">المسار اللغوي (English)</span>
        </span>
      </button>

      <!-- Tab 3: Career Roadmap (Skills + Certifications) -->
      <button 
        onclick="switchTab('roadmap')" 
        id="tabBtn-roadmap"
        class="tab-btn py-2.5 sm:py-3.5 px-2 sm:px-3 rounded-xl text-xs sm:text-sm font-display font-black flex flex-col sm:flex-row items-center justify-center gap-1.5 cursor-pointer"
      >
        <i class="fa-solid fa-compass text-blue-600 text-sm sm:text-base shrink-0"></i>
        <span class="whitespace-nowrap font-extrabold text-[11px] sm:text-xs">
          <span class="sm:hidden">الخارطة 🏆</span>
          <span class="hidden sm:inline">الخارطة والشهادات 🏆</span>
        </span>
      </button>

      <!-- Tab 4: AI & Data Analysis -->
      <button 
        onclick="switchTab('programming')" 
        id="tabBtn-programming"
        class="tab-btn py-2.5 sm:py-3.5 px-2 sm:px-3 rounded-xl text-xs sm:text-sm font-display font-black flex flex-col sm:flex-row items-center justify-center gap-1.5 cursor-pointer"
      >
        <i class="fa-solid fa-brain text-purple-600 text-sm sm:text-base shrink-0"></i>
        <span class="whitespace-nowrap font-extrabold text-[11px] sm:text-xs">
          <span class="sm:hidden">AI والبيانات 📊</span>
          <span class="hidden sm:inline">ذكاء اصطناعي وبيانات 📊</span>
        </span>
      </button>

    </div>
  </div>
</div>
