<!-- MAIN 3-SECTION MASTER NAV TABS (Sticky Navigation: Routine, Career Roadmap & Languages) -->
<div class="max-w-[1560px] mx-auto px-2 sm:px-6 lg:px-8 mt-3 sm:mt-4 sticky top-1 sm:top-3 z-30 no-print">
  <div class="bg-slate-900/85 backdrop-blur-xl rounded-2xl p-1.5 sm:p-2.5 shadow-2xl border border-slate-800">
    <div class="grid grid-cols-3 gap-1.5 sm:gap-3">
      
      <!-- Tab 1: Routine -->
      <button 
        onclick="switchTab('routine')" 
        id="tabBtn-routine"
        class="tab-btn py-2.5 sm:py-3.5 px-2 sm:px-4 rounded-xl text-xs sm:text-sm font-display font-black flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2.5 border border-slate-700/60 bg-slate-800/60 text-slate-200 hover:bg-slate-800 active:scale-95 transition cursor-pointer"
      >
        <i class="fa-solid fa-bolt text-amber-400 text-sm sm:text-lg shrink-0"></i>
        <span class="whitespace-nowrap font-extrabold text-[11px] sm:text-sm">
          <span class="sm:hidden">الروتين اليومي</span>
          <span class="hidden sm:inline">الروتين وسجل الـ 112 يوماً</span>
        </span>
      </button>

      <!-- Tab 2: Career Roadmap (Subjects + Skills + Certs) -->
      <button 
        onclick="switchTab('roadmap')" 
        id="tabBtn-roadmap"
        class="tab-btn py-2.5 sm:py-3.5 px-2 sm:px-4 rounded-xl text-xs sm:text-sm font-display font-black flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2.5 border border-slate-700/60 bg-slate-800/60 text-slate-200 hover:bg-slate-800 active:scale-95 transition cursor-pointer"
      >
        <i class="fa-solid fa-compass text-blue-400 text-sm sm:text-lg shrink-0"></i>
        <span class="whitespace-nowrap font-extrabold text-[11px] sm:text-sm">
          <span class="sm:hidden">المسار الأكاديمي</span>
          <span class="hidden sm:inline">المسار الأكاديمي والمهني</span>
        </span>
      </button>

      <!-- Tab 3: Languages -->
      <button 
        onclick="switchTab('languages')" 
        id="tabBtn-languages"
        class="tab-btn py-2.5 sm:py-3.5 px-2 sm:px-4 rounded-xl text-xs sm:text-sm font-display font-black flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2.5 border border-slate-700/60 bg-slate-800/60 text-slate-200 hover:bg-slate-800 active:scale-95 transition cursor-pointer"
      >
        <i class="fa-solid fa-language text-emerald-400 text-sm sm:text-lg shrink-0"></i>
        <span class="whitespace-nowrap font-extrabold text-[11px] sm:text-sm">
          <span class="sm:hidden">المسار اللغوي</span>
          <span class="hidden sm:inline">المسار اللغوي الشامل</span>
        </span>
      </button>

      <!-- Hidden Legacy Tab for Safe Fallback -->
      <button id="tabBtn-achievements" onclick="switchTab('routine')" class="hidden" style="display: none !important;"></button>

    </div>
  </div>
</div>
