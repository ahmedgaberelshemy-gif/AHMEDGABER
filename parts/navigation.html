<!-- MAIN 4-SECTION MASTER NAV TABS (Inspired by Reference Main Nav Cards) -->
<div class="max-w-[1560px] mx-auto px-2 sm:px-6 lg:px-8 mt-3 sm:mt-4 sticky top-1 sm:top-3 z-30 no-print">
  <div class="bg-white/95 backdrop-blur-xl rounded-2xl p-1.5 sm:p-2 shadow-lg border border-slate-200">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
      
      <!-- Tab 1: Routine -->
      <button 
        type="button"
        onclick="switchTab('routine')" 
        id="tabBtn-routine"
        class="tab-btn py-3 px-3 rounded-2xl text-xs sm:text-sm font-display font-black flex items-center justify-between gap-2.5 cursor-pointer text-right transition-all duration-200 select-none"
      >
        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 border border-amber-200 flex items-center justify-center text-base sm:text-lg shrink-0 shadow-2xs pointer-events-none">
          <i class="fa-solid fa-bolt text-amber-600 pointer-events-none"></i>
        </div>
        <div class="min-w-0 flex-1 pointer-events-none">
          <span class="block font-black text-xs sm:text-sm text-slate-900 leading-snug truncate pointer-events-none">الروتين والـ 112 يوماً</span>
          <span class="block text-[10px] text-slate-500 font-bold truncate pointer-events-none">بوصلة الانضباط اليومي 👑</span>
        </div>
      </button>

      <!-- Tab 2: Languages Track (33 Courses) -->
      <button 
        type="button"
        onclick="switchTab('languages')" 
        id="tabBtn-languages"
        class="tab-btn py-3 px-3 rounded-2xl text-xs sm:text-sm font-display font-black flex items-center justify-between gap-2.5 cursor-pointer text-right transition-all duration-200 select-none"
      >
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-200 flex items-center justify-center text-base sm:text-lg shrink-0 shadow-2xs pointer-events-none">
          <i class="fa-solid fa-language text-emerald-600 pointer-events-none"></i>
        </div>
        <div class="min-w-0 flex-1 pointer-events-none">
          <span class="block font-black text-xs sm:text-sm text-slate-900 leading-snug truncate pointer-events-none">المسار اللغوي (English)</span>
          <span class="block text-[10px] text-slate-500 font-bold truncate pointer-events-none">منهجية ZAmericanEnglish 🌐</span>
        </div>
      </button>

      <!-- Tab 3: Career Roadmap (Skills + Certifications) -->
      <button 
        type="button"
        onclick="switchTab('roadmap')" 
        id="tabBtn-roadmap"
        class="tab-btn py-3 px-3 rounded-2xl text-xs sm:text-sm font-display font-black flex items-center justify-between gap-2.5 cursor-pointer text-right transition-all duration-200 select-none"
      >
        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 border border-blue-200 flex items-center justify-center text-base sm:text-lg shrink-0 shadow-2xs pointer-events-none">
          <i class="fa-solid fa-compass text-blue-600 pointer-events-none"></i>
        </div>
        <div class="min-w-0 flex-1 pointer-events-none">
          <span class="block font-black text-xs sm:text-sm text-slate-900 leading-snug truncate pointer-events-none">الخارطة والشهادات 🏆</span>
          <span class="block text-[10px] text-slate-500 font-bold truncate pointer-events-none">المهارات والاعتمادات الدولية</span>
        </div>
      </button>

      <!-- Tab 4: AI & Data Analysis -->
      <button 
        type="button"
        onclick="switchTab('programming')" 
        id="tabBtn-programming"
        class="tab-btn py-3 px-3 rounded-2xl text-xs sm:text-sm font-display font-black flex items-center justify-between gap-2.5 cursor-pointer text-right transition-all duration-200 select-none"
      >
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 border border-purple-200 flex items-center justify-center text-base sm:text-lg shrink-0 shadow-2xs pointer-events-none">
          <i class="fa-solid fa-brain text-purple-600 pointer-events-none"></i>
        </div>
        <div class="min-w-0 flex-1 pointer-events-none">
          <span class="block font-black text-xs sm:text-sm text-slate-900 leading-snug truncate pointer-events-none">ذكاء اصطناعي وبيانات 📊</span>
          <span class="block text-[10px] text-slate-500 font-bold truncate pointer-events-none">تحليل البيانات والذكاء الاصطناعي</span>
        </div>
      </button>

    </div>
  </div>
</div>
