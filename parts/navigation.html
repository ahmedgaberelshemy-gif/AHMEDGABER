<!-- MAIN 3-SECTION MASTER NAV TABS (Sticky Navigation) -->
    <div class="max-w-7xl mx-auto px-2.5 sm:px-6 lg:px-8 mt-3 sm:mt-4 sticky top-2 sm:top-3 relative z-30 no-print">
      <div class="bg-white/95 backdrop-blur-md rounded-2xl p-1.5 sm:p-2.5 shadow-lg sm:shadow-xl border border-slate-200">
        <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
          
          <!-- Tab 1: Routine -->
          <button 
            onclick="switchTab('routine')" 
            id="tabBtn-routine"
            class="tab-btn py-2.5 sm:py-3 px-2 sm:px-3 rounded-xl text-xs sm:text-sm font-display font-black flex items-center justify-center gap-1.5 sm:gap-2 border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 active:scale-95 transition"
          >
            <i class="fa-solid fa-bolt text-amber-500 text-sm sm:text-base shrink-0"></i>
            <span class="whitespace-nowrap font-bold">الروتين اليومي</span>
          </button>

          <!-- Tab 2: Programming -->
          <button 
            onclick="switchTab('programming')" 
            id="tabBtn-programming"
            class="tab-btn py-2.5 sm:py-3 px-2 sm:px-3 rounded-xl text-xs sm:text-sm font-display font-black flex items-center justify-center gap-1.5 sm:gap-2 border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 active:scale-95 transition"
          >
            <i class="fa-solid fa-laptop-code text-cyan-500 text-sm sm:text-base shrink-0"></i>
            <span class="whitespace-nowrap font-bold">مسار البرمجة</span>
          </button>

          <!-- Tab 3: Achievements -->
          <button 
            onclick="switchTab('achievements')" 
            id="tabBtn-achievements"
            class="tab-btn py-2.5 sm:py-3 px-2 sm:px-3 rounded-xl text-xs sm:text-sm font-display font-black flex items-center justify-center gap-1.5 sm:gap-2 border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 active:scale-95 transition"
          >
            <i class="fa-solid fa-trophy text-amber-500 text-sm sm:text-base shrink-0"></i>
            <span class="whitespace-nowrap font-bold">لوحة الإنجازات</span>
          </button>

        </div>
      </div>
    </div>
