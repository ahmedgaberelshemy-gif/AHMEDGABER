<!-- MAIN 3-SECTION MASTER NAV TABS (Sticky Navigation) -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 sticky top-3 relative z-30 no-print">
      <div class="bg-white/95 backdrop-blur-md rounded-2xl p-2 sm:p-2.5 shadow-xl border border-slate-200">
        <div class="grid grid-cols-3 gap-2">
          
          <!-- Tab 1: Routine -->
          <button 
            onclick="switchTab('routine')" 
            id="tabBtn-routine"
            class="tab-btn py-3 px-3 rounded-xl text-xs sm:text-sm font-display font-black flex items-center justify-center gap-2 border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100"
          >
            <i class="fa-solid fa-bolt text-amber-500 text-sm"></i>
            <span class="truncate">الروتين اليومي</span>
          </button>

          <!-- Tab 2: Curriculum by Subject -->
          <button 
            onclick="switchTab('curriculum')" 
            id="tabBtn-curriculum"
            class="tab-btn py-3 px-3 rounded-xl text-xs sm:text-sm font-display font-black flex items-center justify-center gap-2 border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100"
          >
            <i class="fa-solid fa-book-open text-indigo-500"></i>
            <span class="truncate">📚 مقررات المواد (الـ 6 مواد)</span>
          </button>

          <!-- Tab 3: Achievements -->
          <button 
            onclick="switchTab('achievements')" 
            id="tabBtn-achievements"
            class="tab-btn py-3 px-3 rounded-xl text-xs sm:text-sm font-display font-black flex items-center justify-center gap-2 border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100"
          >
            <i class="fa-solid fa-trophy text-amber-500"></i>
            <span class="truncate">🏆 مركز الإنجازات والتحصيل</span>
          </button>

        </div>
      </div>
    </div>
